# LaMain - design description (identical for every hand).
# This file is versioned with the CAD. No "magic" value should remain in the
# code: every calibration/speed/torque parameter comes from here.
#
# Hardware: five Feetech STS3036 servos (6 V, 360 deg, 4096 ticks -> 0.088 deg).
# The previous SCS0009 design (1024 ticks over 300 deg) is archived at the
# `scs0009-final` git tag. Raw positions are 0..4095; 2048 is the electrical
# zero (the pose used to mount the horns).
#
# Units: positions in ticks (0-4095); angles in degrees unless suffixed.

model_version: "lamain-v2-sts3036"

bus:
  port: /dev/ttyACM0
  baudrate: 1000000
  servo_model: STS3036
  servo:
    controller: Sts3215PyController
    resolution: 4096
    range_deg: 360
    torque_register: torque_limit
    torque_on: 1
    torque_off: 0
    speed_unit: steps_per_s
    acceleration: 50    # 0 leaves the servo motionless on this firmware
    model_number: 521

# Calibration order: abduction first (spreads the fingers), then index/middle,
# thumb last. Every joint is reset to the assembly zero before and after each
# joint by the default calibration; do not use --batch.
calibration_order: [abduction, index_flex, middle_flex, thumb_rot, thumb_flex]

calibration:
  # Tick values are scaled from the SCS0009 design (x4): 8 ticks ~= 0.70 deg.
  step_ticks: 8               # slow-approach step
  # Fast-approach step: keep it at move_speed * settle_s (500 * 0.02 = 10) so
  # the goal never outruns the servo (~10 ticks per read). Larger values make
  # the goal run thousands of ticks ahead of the joint and turn the read budget
  # and the push force at a stop into arbitrary numbers.
  fast_step_ticks: 10         # fast-approach step (locating)
  stable_reads: 10            # N stable reads before suspecting a stop
  stable_epsilon_ticks: 12    # max variation allowed for "stable"
  overrun_ticks: 80           # the command must lead the position by this much
  # Stop confirmation: approaching a stop, PUSH at probe torque and dwell 2 s
  # to really feel it, then head to the other direction.
  probe_torque_pct: 60
  probe_max_s: 2.0
  torque_pct: 40              # sweep torque
  backoff_deg: 7              # back-off before each re-approach
  repeat: 1                   # number of slow measurements (median)
  settle_s: 0.02              # pause between two reads (real hardware)
  joint_timeout_s: 60         # max time per joint before aborting
  progress_every: 30          # print a progress line every N reads
  servo_end_margin_ticks: 160 # stop within X ticks of 0/4095 = "servo end"
  repeat_tolerance_ticks: 8   # beyond this => soft stop (status "uncertain")
  # Logical zero q=0: "middle" = midpoint of the two stops (symmetric both ways)
  # or "mount" = assembly zero (mount pose). "middle" is more robust when the
  # horn is mounted near a stop.
  reference_mode: middle

preconditions:
  min_voltage: 4.8
  max_voltage: 7.4
  warn_temperature: 50
  abort_temperature: 55

safety:
  home_margin_deg: 0         # end-of-travel margin (0 = go to the measured max)
  free_torque_pct: 20
  default_torque_pct: 20     # STS3036 has ~3x the SCS0009 torque: start low
  grasp_torque_pct: 40
  watchdog_timeout_s: 1.0
  max_step_deg_per_cycle: 10
  move_speed: 500            # STS goal_speed in ticks/s (~44 deg/s)

joints:
  # --- Crank: extension = dead center (extremum, not a stop) ---
  index_flex:
    servo_id: 2
    assembly_position: 2048         # STS electrical zero (0 rad)
    type: crank
    reference: dead_center_midpoint # midpoint of the two flexion stops
    branch: positive                # working direction (positive = close)
    nominal_travel_deg: 288         # mechanical design travel
    range_tolerance_deg: 15
    max_speed_dps: 120

  middle_flex:
    servo_id: 3
    assembly_position: 2048
    type: crank
    reference: dead_center_midpoint
    branch: positive
    nominal_travel_deg: 288
    range_tolerance_deg: 15
    max_speed_dps: 120

  # --- Index+middle abduction: fingers together = stop ---
  # Physical mapping: the abduction servo is the first one in the hand (ID 1).
  abduction:
    servo_id: 1
    assembly_position: 2048
    type: two_stop
    reference: hard_stop_min         # fingers together (to confirm with CAD)
    reference_side: auto             # side with the greatest reach
    branch: positive
    nominal_travel_deg: 210
    range_tolerance_deg: 15
    max_speed_dps: 120
    calibration_torque_pct: 60      # the abduction needs a bit more force
    probe_torque_pct: 80

  # --- Thumb base rotation: a stop on each side (to confirm with CAD) ---
  thumb_rot:
    servo_id: 4
    assembly_position: 2048
    type: two_stop
    reference: hard_stop_min         # most repeatable stop (to decide)
    reference_side: auto             # side with the greatest reach
    branch: positive
    nominal_travel_deg: 95
    range_tolerance_deg: 15
    max_speed_dps: 120

  # --- Thumb flexion: crank like ID 1 ---
  thumb_flex:
    servo_id: 5
    assembly_position: 2048
    type: crank
    reference: dead_center_midpoint
    branch: positive
    nominal_travel_deg: 288
    range_tolerance_deg: 15
    max_speed_dps: 120
